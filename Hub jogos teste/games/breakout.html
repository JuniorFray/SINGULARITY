<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Breakout — quebre todos os tijolos neste clássico arcade neon!" />
  <meta name="theme-color" content="#0a0a14" />
  <title>Breakout — Mini Jogos</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/breakout.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="game-page">

  <!-- Start Overlay -->
  <div class="game-overlay" id="overlay-breakout-start" role="dialog" aria-labelledby="breakout-start-title" aria-modal="true">
    <div class="overlay-card">
      <div class="overlay-icon">🧱</div>
      <h1 class="overlay-title" id="breakout-start-title">Breakout</h1>
      <p class="overlay-subtitle">Use as setas do teclado, o mouse ou os botões na tela para mover a barra. Quebre todos os tijolos!</p>
      <button class="btn btn-primary" id="btn-start-breakout" style="background: var(--clr-teal); color: hsl(220, 20%, 7%); border-color: var(--clr-teal); width: 100%;">
        <span>Iniciar</span> <span>🚀</span>
      </button>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div class="game-overlay hidden" id="overlay-breakout-gameover" role="dialog" aria-modal="true">
    <div class="overlay-card">
      <div class="overlay-icon">💀</div>
      <h2 class="overlay-title">Game Over!</h2>
      <p class="overlay-subtitle" id="breakout-go-msg">A bola caiu!</p>
      <div class="overlay-score" id="breakout-go-score">0 pts</div>
      <div id="breakout-highscore-display" style="font-size:0.85rem; color: var(--clr-amber); margin-bottom: var(--sp-md);">🏆 Recorde: 0</div>
      <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; width: 100%;">
        <button class="btn btn-primary" id="btn-breakout-retry" style="background: var(--clr-teal); color: hsl(220, 20%, 7%); border-color: var(--clr-teal); flex: 1;">
          🔄 De Novo
        </button>
        <a href="../index.html" class="btn btn-outline" style="text-decoration:none; flex: 1;">
          🏠 Hub
        </a>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="game-nav" aria-label="Navegação do jogo">
    <a href="../index.html" class="nav-back" id="nav-back-breakout">← Voltar</a>
    <span class="nav-title">🧱 Breakout</span>
    <div class="nav-score" id="breakout-nav-score" aria-live="polite">0 pts</div>
  </nav>

  <!-- Game Area -->
  <main class="game-container">
    <!-- Status -->
    <div class="game-status" role="status" aria-live="polite">
      <div class="status-item">
        <span class="status-label">Pontos</span>
        <span class="status-value" id="breakout-score">0</span>
      </div>
      <div class="status-item">
        <span class="status-label">Vidas</span>
        <span class="status-value" id="breakout-lives">3</span>
      </div>
      <div class="status-item">
        <span class="status-label">Recorde</span>
        <span class="status-value" id="breakout-best">0</span>
      </div>
    </div>

    <!-- Canvas -->
    <div class="breakout-canvas-wrapper">
      <canvas id="breakout-canvas" aria-label="Campo do jogo Breakout"></canvas>
      <div class="pause-overlay" id="breakout-pause-indicator" aria-hidden="true">
        <span>⏸ PAUSADO</span>
        <small>Pressione P para continuar</small>
      </div>
    </div>

    <!-- Touch Controls -->
    <div class="touch-controls" aria-label="Controles de toque" role="group">
      <div class="touch-row">
        <button class="touch-btn" id="touch-left" aria-label="Esquerda">◀</button>
        <button class="touch-btn" id="touch-right" aria-label="Direita">▶</button>
      </div>
      <div class="touch-row" style="margin-top:0.5rem;">
        <button class="touch-btn touch-pause" id="touch-pause" aria-label="Pausar">⏸</button>
      </div>
    </div>
  </main>

  <script src="../js/breakout.js"></script>
</body>
</html>
