<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jogo da Memoria - encontre todos os pares de cartas." />
  <title>Jogo da Memoria | Mini Games Hub</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <style>
    .controls {
      display: flex; gap: var(--sp-md); flex-wrap: wrap; justify-content: center;
    }
    /* Board */
    #memory-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(0.5rem, 2vw, 0.85rem);
      width: min(100%, 440px);
    }
    @media (max-width: 400px) {
      #memory-board { grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
    }

    /* Card */
    .mem-card {
      aspect-ratio: 1;
      border-radius: var(--r-md);
      cursor: pointer;
      perspective: 600px;
      -webkit-tap-highlight-color: transparent;
    }
    .mem-card-inner {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: var(--r-md);
    }
    .mem-card.flipped .mem-card-inner,
    .mem-card.matched .mem-card-inner {
      transform: rotateY(180deg);
    }
    .mem-card-front, .mem-card-back {
      position: absolute; inset: 0; border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid var(--clr-border);
    }
    /* Front = hidden side */
    .mem-card-front {
      background: var(--clr-surface-2);
      font-size: 1.4rem;
      color: var(--clr-muted);
      transition: background var(--t-fast);
    }
    .mem-card:not(.flipped):not(.matched) .mem-card-front:hover {
      background: var(--clr-surface);
    }
    /* Back = emoji */
    .mem-card-back {
      background: hsl(174 50% 12%);
      border-color: hsl(174 60% 25%);
      transform: rotateY(180deg);
      font-size: clamp(1.4rem, 5vw, 2rem);
    }
    .mem-card.matched .mem-card-back {
      background: hsl(174 60% 14%);
      border-color: var(--clr-teal);
      box-shadow: 0 0 12px hsl(174 90% 50% / 0.35);
      animation: matchPop 0.4s var(--t-slow) forwards;
    }
    @keyframes matchPop {
      0%   { transform: rotateY(180deg) scale(1); }
      50%  { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    /* Stats */
    .stat-row {
      display: flex; gap: var(--sp-lg); flex-wrap: wrap; justify-content: center;
    }
    .stat-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; min-width: 70px;
    }
    .stat-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clr-muted); }
    .stat-value { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--clr-teal); }
  </style>
</head>
<body class="game-page">

  <header class="game-header">
    <a href="../../index.html" class="back-link" id="back-home">&#8592; Hub</a>
    <h1 class="game-title">&#129535; Jogo da Memoria</h1>
    <div class="stat-row">
      <div class="stat-item">
        <span class="stat-label">Movimentos</span>
        <span class="stat-value" id="moves-count">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Pares</span>
        <span class="stat-value" id="pairs-count">0/8</span>
      </div>
    </div>
  </header>

  <main class="game-main">
    <div class="controls">
      <button id="btn-restart" class="btn btn-outline">&#8635; Reiniciar</button>
    </div>
    <div id="memory-board" aria-label="Tabuleiro do Jogo da Memoria" role="grid"></div>
  </main>

  <!-- Win Modal -->
  <div class="modal-overlay" id="win-modal" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="modal-box">
      <div style="font-size:3.5rem;margin-bottom:0.5rem">&#127881;</div>
      <h2 class="glow-teal" id="win-title">Parabens!</h2>
      <p id="win-message">Voce encontrou todos os pares!</p>
      <button id="btn-play-again" class="btn btn-primary" style="width:100%">Jogar Novamente</button>
    </div>
  </div>

  <script src="memory.js"></script>
</body>
</html>
